<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookVerse | Discover</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>

<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('discover')}"></div>

    <main class="main-content">

        <h1 class="discover-title">Discover</h1>

        <form th:action="@{/}"
              method="get"
              class="discover-search">

            <i class="bi bi-search"></i>

            <input type="text"
                   name="q"
                   th:value="${query}"
                   placeholder="Search by title, author, keyword, or ISBN"
                   autocomplete="off"
                   required>

            <button type="submit">Search</button>

        </form>

        <section class="section-block"
                 th:if="${query == null or #strings.isEmpty(query)}">

            <h2 class="section-title">Categories</h2>

            <div class="category-grid-home">

                <a th:href="@{/(q='subject:Fiction')}" class="category-card-home">
                    <div class="category-icon-home">
                        <i class="bi bi-book"></i>
                    </div>
                    <div class="category-name-home">Fiction</div>
                </a>

                <a th:href="@{/(q='subject:Self-Help')}" class="category-card-home">
                    <div class="category-icon-home">
                        <i class="bi bi-compass"></i>
                    </div>
                    <div class="category-name-home">Self-Help</div>
                </a>

                <a th:href="@{/(q='subject:Philosophy')}" class="category-card-home">
                    <div class="category-icon-home">
                        <i class="bi bi-journal-text"></i>
                    </div>
                    <div class="category-name-home">Philosophy</div>
                </a>

                <a th:href="@{/(q='subject:Fantasy')}" class="category-card-home">
                    <div class="category-icon-home">
                        <i class="bi bi-stars"></i>
                    </div>
                    <div class="category-name-home">Fantasy</div>
                </a>

                <a th:href="@{/(q='subject:History')}" class="category-card-home">
                    <div class="category-icon-home">
                        <i class="bi bi-bank"></i>
                    </div>
                    <div class="category-name-home">History</div>
                </a>

                <a th:href="@{/(q='subject:Science')}" class="category-card-home">
                    <div class="category-icon-home">
                        <i class="bi bi-lightbulb"></i>
                    </div>
                    <div class="category-name-home">Science</div>
                </a>

                <a th:href="@{/(q='subject:Business')}" class="category-card-home">
                    <div class="category-icon-home">
                        <i class="bi bi-briefcase"></i>
                    </div>
                    <div class="category-name-home">Business</div>
                </a>

                <a th:href="@{/(q='subject:Biography')}" class="category-card-home">
                    <div class="category-icon-home">
                        <i class="bi bi-person"></i>
                    </div>
                    <div class="category-name-home">Biography</div>
                </a>

                <a th:href="@{/(q='subject:Technology')}" class="category-card-home">
                    <div class="category-icon-home">
                        <i class="bi bi-laptop"></i>
                    </div>
                    <div class="category-name-home">Technology</div>
                </a>

                <a th:href="@{/(q='subject:Psychology')}" class="category-card-home">
                    <div class="category-icon-home">
                        <i class="bi bi-chat-square-text"></i>
                    </div>
                    <div class="category-name-home">Psychology</div>
                </a>

            </div>

        </section>

        <section th:if="${books != null}" class="section-block">

            <div class="results-header">

                <div>
                    <h2 class="section-title results-title">Results</h2>

                    <div class="results-query"
                         th:if="${query != null}"
                         th:text="${query}">
                        Query
                    </div>
                </div>

                <a th:href="@{/}" class="clear-button">Clear</a>

            </div>

            <div class="results-grid"
                 th:if="${!#lists.isEmpty(books)}">

                <a th:each="book : ${books}"
                   th:href="@{/book/{id}(id=${book.id})}"
                   class="result-link">

                    <article class="result-card">

                        <div class="result-cover-area">

                            <img th:if="${book.image != null and !#strings.isEmpty(book.image)}"
                                 th:src="${book.image}"
                                 th:alt="${book.title}"
                                 class="result-cover">

                            <img th:unless="${book.image != null and !#strings.isEmpty(book.image)}"
                                 src="https://placehold.co/300x450?text=No+Cover"
                                 alt="No Cover"
                                 class="result-cover">

                        </div>

                        <div class="result-info">

                            <div class="result-title"
                                 th:text="${book.title}">
                                Book Title
                            </div>

                            <div class="result-author"
                                 th:text="${book.author != null ? book.author : 'Unknown author'}">
                                Author
                            </div>

                            <div class="result-bottom">

                                <span th:if="${book.rating != null and book.rating > 0}">
                                    <span class="rating-star">★</span>
                                    <span th:text="${book.rating}">4.5</span>
                                </span>

                                <span th:if="${book.rating == null or book.rating <= 0}">
                                    No rating
                                </span>

                                <i class="bi bi-arrow-up-right"></i>

                            </div>

                        </div>

                    </article>

                </a>

            </div>

            <div class="no-results"
                 th:if="${#lists.isEmpty(books)}">
                No books found.
            </div>

        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
