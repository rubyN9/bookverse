<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>BookVerse - Search Results</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0f2f26;
            color:white;
        }

        .book-card{
            background:#173f34;
            border:none;
            border-radius:18px;
            transition:.3s;
            overflow:hidden;
        }

        .book-card:hover{
            transform:translateY(-8px);
            box-shadow:0 15px 30px rgba(0,0,0,.35);
        }

        .book-card img{
            height:320px;
            object-fit:cover;
        }

        .rating{
            color:gold;
            font-weight:bold;
        }

    </style>

</head>
<body>

<div class="container py-5">

    <h1 class="text-center mb-5">
        Search Results
    </h1>

    <div class="row g-4">

        <div class="col-md-4"
             th:each="book : ${books}">

            <div class="card book-card h-100">

                <img th:if="${book.image != null and !#strings.isEmpty(book.image)}"
                     th:src="${book.image}"
                     class="card-img-top">

                <img th:unless="${book.image != null and !#strings.isEmpty(book.image)}"
                     src="https://placehold.co/300x450?text=No+Cover"
                     class="card-img-top">

                <div class="card-body">

                    <h4 th:text="${book.title}"></h4>

                    <p>
                        <strong>Author:</strong>
                        <span th:text="${book.author}"></span>
                    </p>

                    <p>
                        <strong>Category:</strong>
                        <span th:text="${book.category}"></span>
                    </p>

                    <p class="rating">
                        ⭐ <span th:text="${book.rating}"></span>
                    </p>

                    <p th:text="${book.description}"></p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
