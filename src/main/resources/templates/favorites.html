<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Favorites - BookVerse</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Our CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        /* Smaller favorite cards */
        .favorite-card {
            max-width: 220px;
            margin: auto;
            border-radius: 12px;
            overflow: hidden;
        }

        .favorite-cover {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }

        .favorite-title {
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .favorite-author {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .favorite-info {
            font-size: 0.85rem;
        }

        .favorite-category {
            max-width: 65%;
            white-space: normal;
            line-height: 1.3;
            font-size: 0.72rem;
        }

        .favorite-card .card-body {
            padding: 14px;
        }

        .favorite-card .card-footer {
            padding: 0 14px 14px;
        }

        .favorite-card .btn {
            font-size: 0.85rem;
            padding: 6px 10px;
        }

    </style>

</head>

<body>


<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">

    <div class="container">

        <a class="navbar-brand fw-bold fs-2"
           th:href="@{/}">
            📚 BookVerse
        </a>

        <div class="d-flex gap-2">

            <a class="btn btn-outline-secondary"
               th:href="@{/}">
                <i class="bi bi-house"></i>
                Home
            </a>

            <a class="btn btn-success"
               th:href="@{/favorites}">
                <i class="bi bi-heart-fill"></i>
                Favorites
            </a>

        </div>

    </div>

</nav>


<!-- Favorites -->
<div class="container py-4">

    <!-- Header -->
    <div class="mb-4">

        <h2 class="fw-bold">
            My Favorites
        </h2>

        <p class="text-muted mb-0">
            Books you've saved to your favorites.
        </p>

    </div>


    <!-- No Favorites -->
    <div th:if="${#lists.isEmpty(favorites)}"
         class="text-center py-5">

        <i class="bi bi-heart fs-1 text-muted"></i>

        <h3 class="mt-3">
            No favorites yet
        </h3>

        <p class="text-muted">
            Start exploring and save books you love.
        </p>

        <a th:href="@{/}"
           class="btn btn-success mt-2">
            Browse Books
        </a>

    </div>


    <!-- Favorite Books -->
    <div th:if="${!#lists.isEmpty(favorites)}"
         class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3">


        <!-- One Book -->
        <div class="col"
             th:each="book : ${favorites}">

            <div class="card favorite-card h-100 shadow-sm border-0">


                <!-- Book Cover -->
                <a th:href="@{/book/{id}(id=${book.googleBookId})}">

                    <img th:src="${book.image}"
                         th:alt="${book.title}"
                         class="card-img-top favorite-cover">

                </a>


                <!-- Book Information -->
                <div class="card-body d-flex flex-column">


                    <!-- Title -->
                    <h5 class="card-title fw-bold favorite-title"
                        th:text="${book.title}">
                        Book Title
                    </h5>


                    <!-- Author -->
                    <p class="text-muted favorite-author"
                       th:text="${book.author}">
                        Author
                    </p>


                    <!-- Rating + Category -->
                    <div class="favorite-info
                                d-flex
                                justify-content-between
                                align-items-start
                                gap-2
                                mt-auto">


                        <!-- Rating -->
                        <span class="text-nowrap">

                            ⭐

                            <span th:text="${book.rating}">
                                0
                            </span>

                        </span>


                        <!-- Category -->
                        <span class="badge text-bg-light
                                     text-wrap text-end
                                     favorite-category"
                              th:text="${book.genre}">
                            Category
                        </span>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="card-footer bg-white border-0">


                    <!-- View Book -->
                    <a th:href="@{/book/{id}(id=${book.googleBookId})}"
                       class="btn btn-outline-success w-100 mb-2">

                        View Book

                    </a>


                    <!-- Remove -->
                    <form th:action="@{/book/{id}/remove-favorite(id=${book.googleBookId})}"
                          method="post">

                        <button type="submit"
                                class="btn btn-outline-danger w-100">

                            <i class="bi bi-trash"></i>
                            Remove

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
