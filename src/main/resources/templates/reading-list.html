<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="'BookVerse | ' + ${pageTitle}">
        BookVerse | Reading List
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/reading-list.css}">
</head>

<body>

<div class="app-layout">

    <div th:if="${status != null and status.name() == 'WANT_TO_READ'}"
         th:replace="~{fragments/sidebar :: sidebar('want-to-read')}">
    </div>

    <div th:if="${status != null and status.name() == 'READING'}"
         th:replace="~{fragments/sidebar :: sidebar('reading')}">
    </div>

    <div th:if="${status != null and status.name() == 'READ'}"
         th:replace="~{fragments/sidebar :: sidebar('read')}">
    </div>

    <main class="main-content">

        <div class="reading-header">

            <h1 class="reading-title"
                th:text="${pageTitle}">
                Reading List
            </h1>

            <div class="book-count"
                 th:if="${books != null}">

                <i class="bi bi-book"></i>

                <span th:text="${#lists.size(books)}">
                    0
                </span>

                <span>Books</span>

            </div>

        </div>

        <div class="reading-grid"
             th:if="${books != null and !#lists.isEmpty(books)}">

            <article class="reading-book"
                     th:each="book : ${books}">

                <div class="reading-cover-wrap">

                    <a th:href="@{/book/{id}(id=${book.googleBookId})}">

                        <img th:if="${book.image != null and !#strings.isEmpty(book.image)}"
                             th:src="${book.image}"
                             th:alt="${book.title}"
                             class="reading-cover">

                        <img th:unless="${book.image != null and !#strings.isEmpty(book.image)}"
                             src="https://placehold.co/300x450?text=No+Cover"
                             alt="No Cover"
                             class="reading-cover">

                    </a>

                    <div class="favorite-icon"
                         th:if="${book.favorite}"
                         title="Favorite">

                        <i class="bi bi-heart-fill"></i>

                    </div>

                </div>

                <div class="reading-info">

                    <a th:href="@{/book/{id}(id=${book.googleBookId})}"
                       class="reading-book-title"
                       th:text="${book.title}">
                        Book Title
                    </a>

                    <div class="reading-author"
                         th:text="${book.author != null ? book.author : 'Unknown author'}">
                        Author
                    </div>

                    <div class="reading-meta">

                        <span class="status-badge-small"
                              th:text="${
                                  book.readingStatus.name() == 'WANT_TO_READ'
                                  ? 'Want to Read'
                                  : (
                                      book.readingStatus.name() == 'READING'
                                      ? 'Reading'
                                      : 'Read'
                                  )
                              }">
                            Reading
                        </span>

                        <span class="rating-small"
                              th:if="${book.rating != null and book.rating > 0}">

                            <i class="bi bi-star-fill"></i>

                            <span th:text="${book.rating}">
                                4.5
                            </span>

                        </span>

                    </div>

                    <div class="reading-actions">

                        <form th:action="@{/book/{id}/status(id=${book.googleBookId})}"
                              method="post">

                            <select name="status"
                                    class="status-select"
                                    onchange="this.form.submit()">

                                <option value="WANT_TO_READ"
                                        th:selected="${book.readingStatus != null
                                        and book.readingStatus.name() == 'WANT_TO_READ'}">
                                    Want to Read
                                </option>

                                <option value="READING"
                                        th:selected="${book.readingStatus != null
                                        and book.readingStatus.name() == 'READING'}">
                                    Reading
                                </option>

                                <option value="READ"
                                        th:selected="${book.readingStatus != null
                                        and book.readingStatus.name() == 'READ'}">
                                    Read
                                </option>

                            </select>

                        </form>

                        <a th:href="@{/book/{id}(id=${book.googleBookId})}"
                           class="view-button">
                            View
                        </a>

                    </div>

                    <form th:action="@{/book/{id}/remove-status(id=${book.googleBookId})}"
                          method="post">

                        <button type="submit"
                                class="remove-button">
                            Remove from list
                        </button>

                    </form>

                </div>

            </article>

        </div>

        <div class="empty-reading"
             th:if="${books == null or #lists.isEmpty(books)}">

            <div class="empty-icon">

                <i th:if="${status != null and status.name() == 'WANT_TO_READ'}"
                   class="bi bi-bookmark">
                </i>

                <i th:if="${status != null and status.name() == 'READING'}"
                   class="bi bi-book-half">
                </i>

                <i th:if="${status != null and status.name() == 'READ'}"
                   class="bi bi-check-circle">
                </i>

            </div>

            <h2 th:if="${status != null and status.name() == 'WANT_TO_READ'}">
                No books in Want to Read
            </h2>

            <h2 th:if="${status != null and status.name() == 'READING'}">
                No books currently being read
            </h2>

            <h2 th:if="${status != null and status.name() == 'READ'}">
                No finished books yet
            </h2>

            <a th:href="@{/}"
               class="discover-button">
                Discover Books
            </a>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
