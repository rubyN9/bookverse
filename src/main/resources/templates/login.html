<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BookVerse</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<div class="auth-wrapper">

    <a th:href="@{/}"
       class="auth-logo">

        <div class="auth-logo-mark">
            <i class="bi bi-book"></i>
        </div>

        <span>BookVerse</span>

    </a>

    <div class="auth-card">

        <h1 class="auth-title">
            Welcome back
        </h1>

        <p class="auth-subtitle">
            Sign in to continue to your library.
        </p>

        <div th:if="${errorMessage != null}"
             class="auth-error">

            <i class="bi bi-exclamation-circle"></i>

            <span th:text="${errorMessage}">
                Invalid email or password.
            </span>

        </div>

        <form th:action="@{/login}"
              method="post">

            <div class="mb-3">

                <label for="email"
                       class="form-label">
                    Email
                </label>

                <div class="input-wrapper">

                    <i class="bi bi-envelope input-icon"></i>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control auth-input"
                           placeholder="you@example.com"
                           th:value="${email}"
                           autocomplete="email"
                           required>

                </div>

            </div>

            <div class="mb-3">

                <label for="password"
                       class="form-label">
                    Password
                </label>

                <div class="input-wrapper">

                    <i class="bi bi-lock input-icon"></i>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control auth-input password-input"
                           placeholder="Enter your password"
                           autocomplete="current-password"
                           required>

                    <button type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password">

                        <i class="bi bi-eye"
                           id="passwordToggleIcon"></i>

                    </button>

                </div>

            </div>

            <button type="submit"
                    class="auth-button">
                Login
            </button>

        </form>

        <div class="auth-footer">

            Don't have an account?

            <a th:href="@{/register}">
                Create one
            </a>

        </div>

    </div>

    <div class="back-home">

        <a th:href="@{/}">

            <i class="bi bi-arrow-left"></i>

            Back to Discover

        </a>

    </div>

</div>

<script>
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.getElementById("passwordToggle");
    const passwordToggleIcon = document.getElementById("passwordToggleIcon");

    passwordToggle.addEventListener("click", function () {
        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";
        passwordToggleIcon.className = isPassword
            ? "bi bi-eye-slash"
            : "bi bi-eye";

        passwordToggle.setAttribute(
            "aria-label",
            isPassword ? "Hide password" : "Show password"
        );
    });
</script>

</body>
</html>
