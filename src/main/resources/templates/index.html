<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Bookverse</title>

        <style>
            body {
                font-family: Arial;
            }

            .card {
                border: 1px solid #ddd;
                margin: 10px;
                padding: 10px;
                display: flex;
                gap: 10px;
                align-items: flex-start;
            }

            .card img {
                width: 80px;
                height: 120px;
                object-fit: cover;
            }
        </style>
    </head>

    <body>

    <h1>Search Books 📚</h1>

    <input id="searchBox" placeholder="Search book...">
    <button onclick="search()">Search</button>

    <div id="results"></div>

    <script>

        async function search() {

            const query = document.getElementById("searchBox").value;

            const res = await fetch("http://localhost:8080/search?q=" + query);

            const data = await res.json();

            let html = "";

            if (data.length === 0) {

                document.getElementById("results").innerHTML = "No results found";

                return;

            }

            data.forEach(book => {

                let img = book.image;

                if (!img || img === "") {

                    img = "https://via.placeholder.com/80x120?text=No+Image";

                } else {

                    img = img.replace("http://", "https://");

                }

                html += `
            <div class="card">

                <img src="${img}">

                <div>

                    <h3>${book.title}</h3>

                    <p>${book.description.substring(0,120)}</p>

                </div>

            </div>
        `;

            });

            document.getElementById("results").innerHTML = html;

        }

    </script>

    </body>
    </html>
